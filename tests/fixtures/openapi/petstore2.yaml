swagger: "2.0"
info:
  title: Swagger Petstore
  description: A small petstore.
  version: "1.0"
host: petstore.example.com
basePath: /v2
schemes: [http, https]
securityDefinitions:
  api_key:
    type: apiKey
    name: api_key
    in: header
  basicAuth:
    type: basic
security:
  - api_key: []
paths:
  /pet:
    post:
      operationId: addPet
      summary: Add a pet
      tags: [pet]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/Pet"
      responses:
        "200":
          description: ok
          schema:
            $ref: "#/definitions/Pet"
  /pet/findByStatus:
    get:
      operationId: findPetsByStatus
      summary: Finds pets by status
      parameters:
        - name: status
          in: query
          required: true
          type: array
          items:
            type: string
            enum: [available, pending, sold]
          default: available
      responses:
        "200":
          description: ok
          schema:
            type: array
            items:
              $ref: "#/definitions/Pet"
  /pet/{petId}:
    parameters:
      - name: petId
        in: path
        type: integer
        format: int64
    get:
      operationId: getPetById
      security:
        - basicAuth: []
      responses:
        "200":
          description: ok
          schema:
            $ref: "#/definitions/Pet"
          examples:
            application/json: {id: 7, name: Rex, status: sold}
    head:
      operationId: headPet
      responses:
        "200":
          description: ok
    post:
      operationId: updatePetWithForm
      consumes: [application/x-www-form-urlencoded]
      parameters:
        - name: name
          in: formData
          type: string
          required: true
        - name: status
          in: formData
          type: string
      responses:
        "200":
          description: ok
    delete:
      parameters:
        - name: api_key
          in: header
          type: string
      responses:
        "400":
          description: bad id
definitions:
  Category:
    type: object
    properties:
      id: {type: integer}
      name: {type: string}
  Pet:
    type: object
    required: [name]
    properties:
      id: {type: integer, format: int64}
      name: {type: string, example: doggie}
      category:
        $ref: "#/definitions/Category"
      status:
        type: string
        enum: [available, pending, sold]
